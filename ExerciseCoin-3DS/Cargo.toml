[package]
name = "excoin"
version = "0.1.0"
edition = "2021"
description = "Exercise Coin, pocket: the 3DS client"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "horizon")'.dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
ctru-sys = { git = "https://github.com/rust3ds/ctru-rs" }

[package.metadata.cargo-3ds]
name = "Exercise Coin"
author = "sp00nznet"
description = "Walk, earn EXC, trade it"
icon = "icon.png"

[profile.release]
opt-level = 3
panic = "abort"
